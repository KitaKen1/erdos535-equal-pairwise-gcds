name: Lean Comparator verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  reduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the reduction, exact FC types, and axioms
        working-directory: lean
        run: |
          mkdir -p ../verification/results
          lake exe cache get Mathlib
          lake env bash ../verification/verify.sh --reduction | tee ../verification/results/reduction.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reduction-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/results/reduction.log
          retention-days: 90
          if-no-files-found: ignore

  prepare-border:
    uses: ./.github/workflows/comparator.yml
    with:
      stage: border
      target: OAI.Computability.BorderVNP.DiagonalPaidColumns
      checkpoint: true

  prepare-spectral:
    uses: ./.github/workflows/comparator.yml
    with:
      stage: spectral
      target: OAI.LinearAlgebra.SpectralBooks.CompanionGeometry
      checkpoint: true

  audit-first:
    needs: [prepare-border, prepare-spectral]
    uses: ./.github/workflows/comparator.yml
    with:
      stage: first
      checkpoint: true
      border-cache: ${{ needs.prepare-border.outputs.cache-key }}
      spectral-cache: ${{ needs.prepare-spectral.outputs.cache-key }}

  audit-resume:
    needs: audit-first
    if: needs.audit-first.outputs.verified == 'false'
    uses: ./.github/workflows/comparator.yml
    with:
      stage: resume
      checkpoint: true

  audit-final:
    needs: audit-resume
    if: needs.audit-resume.outputs.verified == 'false'
    uses: ./.github/workflows/comparator.yml
    with:
      stage: final
      checkpoint: false
