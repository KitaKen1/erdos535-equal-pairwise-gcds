name: Lean Comparator verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  reduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the reduction, exact FC types, and axioms
        working-directory: lean
        run: |
          mkdir -p ../verification/results
          lake exe cache get Mathlib
          lake env bash ../verification/verify.sh --reduction | tee ../verification/results/reduction.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reduction-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/results/reduction.log
          retention-days: 90
          if-no-files-found: ignore

  prepare-border:
    uses: ./.github/workflows/comparator.yml
    with:
      stage: border
      target: OAI.Computability.BorderVNP.DiagonalPaidColumns
      checkpoint: true

  prepare-spectral:
    uses: ./.github/workflows/comparator.yml
    with:
      stage: spectral
      target: OAI.LinearAlgebra.SpectralBooks.CompanionGeometry
      checkpoint: true

  prepare-writer:
    uses: ./.github/workflows/comparator.yml
    with:
      stage: writer
      target: OAI.Computability.BorderVNP.DiagonalCalendarWriterPostChosenClock
      checkpoint: true

  audit-first:
    needs: [prepare-border, prepare-spectral, prepare-writer]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/comparator.yml
    with:
      stage: first
      checkpoint: true
      border-cache: ${{ needs.prepare-border.outputs.cache-key }}
      spectral-cache: ${{ needs.prepare-spectral.outputs.cache-key }}
      writer-cache: ${{ needs.prepare-writer.outputs.cache-key }}
      serial-build: ${{ needs.prepare-border.outputs.serial-build == 'true' || needs.prepare-writer.outputs.serial-build == 'true' || needs.prepare-border.outputs.cache-key == '' }}

  audit-resume:
    needs: audit-first
    if: ${{ !cancelled() && needs.audit-first.result != 'skipped' && needs.audit-first.outputs.verified != 'true' && needs.audit-first.outputs.fatal != 'true' }}
    uses: ./.github/workflows/comparator.yml
    with:
      stage: resume
      checkpoint: true
      serial-build: ${{ needs.audit-first.outputs.serial-build == 'true' || needs.audit-first.outputs.cache-key == '' }}

  audit-resume-2:
    needs: audit-resume
    if: ${{ !cancelled() && needs.audit-resume.result != 'skipped' && needs.audit-resume.outputs.verified != 'true' && needs.audit-resume.outputs.fatal != 'true' }}
    uses: ./.github/workflows/comparator.yml
    with:
      stage: resume-2
      checkpoint: true
      serial-build: ${{ needs.audit-resume.outputs.serial-build == 'true' || needs.audit-resume.outputs.cache-key == '' }}

  audit-resume-3:
    needs: audit-resume-2
    if: ${{ !cancelled() && needs.audit-resume-2.result != 'skipped' && needs.audit-resume-2.outputs.verified != 'true' && needs.audit-resume-2.outputs.fatal != 'true' }}
    uses: ./.github/workflows/comparator.yml
    with:
      stage: resume-3
      checkpoint: true
      serial-build: ${{ needs.audit-resume-2.outputs.serial-build == 'true' || needs.audit-resume-2.outputs.cache-key == '' }}

  audit-resume-4:
    needs: audit-resume-3
    if: ${{ !cancelled() && needs.audit-resume-3.result != 'skipped' && needs.audit-resume-3.outputs.verified != 'true' && needs.audit-resume-3.outputs.fatal != 'true' }}
    uses: ./.github/workflows/comparator.yml
    with:
      stage: resume-4
      checkpoint: true
      serial-build: ${{ needs.audit-resume-3.outputs.serial-build == 'true' || needs.audit-resume-3.outputs.cache-key == '' }}

  audit-resume-5:
    needs: audit-resume-4
    if: ${{ !cancelled() && needs.audit-resume-4.result != 'skipped' && needs.audit-resume-4.outputs.verified != 'true' && needs.audit-resume-4.outputs.fatal != 'true' }}
    uses: ./.github/workflows/comparator.yml
    with:
      stage: resume-5
      checkpoint: true
      serial-build: ${{ needs.audit-resume-4.outputs.serial-build == 'true' || needs.audit-resume-4.outputs.cache-key == '' }}

  audit-resume-6:
    needs: audit-resume-5
    if: ${{ !cancelled() && needs.audit-resume-5.result != 'skipped' && needs.audit-resume-5.outputs.verified != 'true' && needs.audit-resume-5.outputs.fatal != 'true' }}
    uses: ./.github/workflows/comparator.yml
    with:
      stage: resume-6
      checkpoint: true
      serial-build: ${{ needs.audit-resume-5.outputs.serial-build == 'true' || needs.audit-resume-5.outputs.cache-key == '' }}

  audit-resume-7:
    needs: audit-resume-6
    if: ${{ !cancelled() && needs.audit-resume-6.result != 'skipped' && needs.audit-resume-6.outputs.verified != 'true' && needs.audit-resume-6.outputs.fatal != 'true' }}
    uses: ./.github/workflows/comparator.yml
    with:
      stage: resume-7
      checkpoint: true
      serial-build: ${{ needs.audit-resume-6.outputs.serial-build == 'true' || needs.audit-resume-6.outputs.cache-key == '' }}

  audit-resume-8:
    needs: audit-resume-7
    if: ${{ !cancelled() && needs.audit-resume-7.result != 'skipped' && needs.audit-resume-7.outputs.verified != 'true' && needs.audit-resume-7.outputs.fatal != 'true' }}
    uses: ./.github/workflows/comparator.yml
    with:
      stage: resume-8
      checkpoint: true
      serial-build: ${{ needs.audit-resume-7.outputs.serial-build == 'true' || needs.audit-resume-7.outputs.cache-key == '' }}

  audit-resume-9:
    needs: audit-resume-8
    if: ${{ !cancelled() && needs.audit-resume-8.result != 'skipped' && needs.audit-resume-8.outputs.verified != 'true' && needs.audit-resume-8.outputs.fatal != 'true' }}
    uses: ./.github/workflows/comparator.yml
    with:
      stage: resume-9
      checkpoint: true
      serial-build: ${{ needs.audit-resume-8.outputs.serial-build == 'true' || needs.audit-resume-8.outputs.cache-key == '' }}

  audit-final:
    needs: audit-resume-9
    if: ${{ !cancelled() && needs.audit-resume-9.result != 'skipped' && needs.audit-resume-9.outputs.verified != 'true' && needs.audit-resume-9.outputs.fatal != 'true' }}
    uses: ./.github/workflows/comparator.yml
    with:
      stage: final
      checkpoint: false
      serial-build: ${{ needs.audit-resume-9.outputs.serial-build == 'true' || needs.audit-resume-9.outputs.cache-key == '' }}

  verification-result:
    name: Require the reduction and unconditional Lean audits
    if: ${{ !cancelled() }}
    needs:
      - reduction
      - audit-first
      - audit-resume
      - audit-resume-2
      - audit-resume-3
      - audit-resume-4
      - audit-resume-5
      - audit-resume-6
      - audit-resume-7
      - audit-resume-8
      - audit-resume-9
      - audit-final
    runs-on: ubuntu-24.04
    env:
      REDUCTION_RESULT: ${{ needs.reduction.result }}
      PROOF_VERIFIED: ${{ contains(needs.*.outputs.verified, 'true') }}
    steps:
      - run: |
          if [[ "$REDUCTION_RESULT" != success || "$PROOF_VERIFIED" != true ]]; then
            echo 'The run must verify the exact types, axioms and proofs of all three unconditional theorems.'
            exit 1
          fi
