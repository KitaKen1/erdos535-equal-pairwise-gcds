name: Build and verify the unconditional proofs

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      checkpoint:
        required: true
        type: boolean
      target:
        type: string
        default: OAI.Combinatorics.Sunflower.FixedBase
      border-cache:
        type: string
      spectral-cache:
        type: string
    outputs:
      verified:
        value: ${{ jobs.audit.outputs.verified }}
      cache-key:
        value: ${{ jobs.audit.outputs.cache-key }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  audit:
    outputs:
      verified: ${{ steps.compare.outputs.verified || 'false' }}
      cache-key: ${{ steps.upstream.outputs.cache-key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENAI_MATH_COMMIT: 3344da59991ed94f9ba711217b29c1d760badfa6
      COMPARATOR_COMMIT: fd5d5bcf14177b187f66d4502071268d877887c3
      LEAN_TOOLCHAIN: leanprover/lean4:v4.34.1
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned OpenAI source and Mathlib cache
        run: |
          mkdir -p verification/results
          git init "$RUNNER_TEMP/openai-math"
          git -C "$RUNNER_TEMP/openai-math" remote add origin https://github.com/openai/math.git
          git -C "$RUNNER_TEMP/openai-math" fetch --depth=1 --filter=blob:none origin "$OPENAI_MATH_COMMIT"
          git -C "$RUNNER_TEMP/openai-math" sparse-checkout set lean
          git -C "$RUNNER_TEMP/openai-math" checkout --detach "$OPENAI_MATH_COMMIT"
          cd "$RUNNER_TEMP/openai-math/lean"
          {
            lake update
            lake exe cache get Mathlib
          } 2>&1 | tee "$GITHUB_WORKSPACE/verification/results/upstream-setup.log"
      - name: Restore previous upstream build
        id: seed
        if: inputs.border-cache == '' || inputs.spectral-cache == ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/openai-math/lean/.lake/build
            ${{ runner.temp }}/openai-math/lean/.lake/packages/lemmata/lean/.lake/build
            ${{ runner.temp }}/openai-math/lean/.lake/packages/fixed-point-theorems/.lake/build
          key: erdos535-openai-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENAI_MATH_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}
          restore-keys: |
            erdos535-openai-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENAI_MATH_COMMIT }}-complete-
            erdos535-openai-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENAI_MATH_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}-
            erdos535-openai-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENAI_MATH_COMMIT }}-
      - name: Restore the BorderVNP branch
        id: border
        if: inputs.border-cache != ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/openai-math/lean/.lake/build
            ${{ runner.temp }}/openai-math/lean/.lake/packages/lemmata/lean/.lake/build
            ${{ runner.temp }}/openai-math/lean/.lake/packages/fixed-point-theorems/.lake/build
          key: ${{ inputs.border-cache }}
      - name: Restore the SpectralBooks branch
        id: spectral
        if: inputs.spectral-cache != '' && inputs.spectral-cache != inputs.border-cache && !contains(steps.border.outputs.cache-matched-key, '-complete-')
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/openai-math/lean/.lake/build
            ${{ runner.temp }}/openai-math/lean/.lake/packages/lemmata/lean/.lake/build
            ${{ runner.temp }}/openai-math/lean/.lake/packages/fixed-point-theorems/.lake/build
          key: ${{ inputs.spectral-cache }}
      - name: Build the upstream sunflower theorem
        id: upstream
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
          STAGE: ${{ inputs.stage }}
          TARGET: ${{ inputs.target }}
          CACHE_PREFIX: erdos535-openai-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENAI_MATH_COMMIT }}
          RESTORED_KEY: ${{ steps.spectral.outputs.cache-matched-key || steps.border.outputs.cache-matched-key || steps.seed.outputs.cache-matched-key }}
        run: |
          cd "$RUNNER_TEMP/openai-math/lean"
          full_target=OAI.Combinatorics.Sunflower.FixedBase
          if [[ "$TARGET" != "$full_target" && "$RESTORED_KEY" == "$CACHE_PREFIX-complete-"* ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "cache-key=$RESTORED_KEY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          timeout --kill-after=30s 300m lake build "+$TARGET:olean" \
            2>&1 | tee "$GITHUB_WORKSPACE/verification/results/upstream-build.log" || status=$?
          cache_suffix="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$STAGE"
          if [[ "$status" == 0 && "$TARGET" == "$full_target" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            if [[ "$RESTORED_KEY" == "$CACHE_PREFIX-complete-"* ]]; then
              echo "cache-key=$RESTORED_KEY" >> "$GITHUB_OUTPUT"
            else
              echo "cache-key=$CACHE_PREFIX-complete-$cache_suffix" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "cache-key=$CACHE_PREFIX-$cache_suffix" >> "$GITHUB_OUTPUT"
            if [[ "$status" == 124 && "$CHECKPOINT" == true ]]; then
              echo 'Build time limit reached. The next runner will continue from the saved cache.'
            elif [[ "$status" != 0 ]]; then
              exit "$status"
            fi
          fi
      - name: Save completed upstream modules
        if: ${{ !cancelled() && steps.upstream.outputs.cache-key != '' && steps.upstream.outputs.cache-key != steps.seed.outputs.cache-matched-key && steps.upstream.outputs.cache-key != steps.border.outputs.cache-matched-key && steps.upstream.outputs.cache-key != steps.spectral.outputs.cache-matched-key }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/openai-math/lean/.lake/build
            ${{ runner.temp }}/openai-math/lean/.lake/packages/lemmata/lean/.lake/build
            ${{ runner.temp }}/openai-math/lean/.lake/packages/fixed-point-theorems/.lake/build
          key: ${{ steps.upstream.outputs.cache-key }}
      - name: Build the pinned Lean Comparator and exporter
        if: steps.upstream.outputs.ready == 'true'
        run: |
          git init "$RUNNER_TEMP/comparator"
          git -C "$RUNNER_TEMP/comparator" fetch --depth=1 https://github.com/leanprover/comparator.git "$COMPARATOR_COMMIT"
          git -C "$RUNNER_TEMP/comparator" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/comparator"
          lake "+$LEAN_TOOLCHAIN" build Comparator lean4export
      - name: Compare the exact FC declarations and replay the compiled proof
        id: compare
        if: steps.upstream.outputs.ready == 'true'
        run: |
          cd "$RUNNER_TEMP/openai-math/lean"
          lake env bash "$GITHUB_WORKSPACE/verification/verify.sh" --comparator "$RUNNER_TEMP/comparator" \
            2>&1 | tee "$GITHUB_WORKSPACE/verification/results/full-audit.log"
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: comparator-audit-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}
          path: verification/results/
          retention-days: 90
          if-no-files-found: ignore
