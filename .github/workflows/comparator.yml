name: Build and verify the unconditional proofs

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      checkpoint:
        required: true
        type: boolean
      seed-cache:
        type: string
      restore-frontier:
        type: boolean
        default: false
    outputs:
      verified:
        value: ${{ jobs.audit.outputs.verified }}
      cache-key:
        value: ${{ jobs.audit.outputs.cache-key }}
      fatal:
        value: ${{ jobs.audit.outputs.fatal }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  audit:
    outputs:
      verified: ${{ steps.compare.outputs.verified || 'false' }}
      cache-key: ${{ steps.upstream.outputs.cache-key }}
      fatal: ${{ steps.upstream.outputs.fatal || (steps.compare.outcome == 'failure' && 'true') || 'false' }}
    runs-on: ubuntu-24.04
    # The caller requires an explicit proof-verification result. A lost runner can be retried.
    continue-on-error: true
    timeout-minutes: 330
    env:
      OPENAI_MATH_COMMIT: 3344da59991ed94f9ba711217b29c1d760badfa6
      COMPARATOR_COMMIT: fd5d5bcf14177b187f66d4502071268d877887c3
      LEAN_TOOLCHAIN: leanprover/lean4:v4.34.1
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned OpenAI source and Mathlib cache
        run: |
          mkdir -p verification/results
          bash verification/setup_upstream.sh 2>&1 | tee verification/results/upstream-setup.log
      - name: Restore previous upstream build
        id: seed
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/openai-math/lean/.lake/build
            ${{ runner.temp }}/openai-math/lean/.lake/packages/lemmata/lean/.lake/build
            ${{ runner.temp }}/openai-math/lean/.lake/packages/fixed-point-theorems/.lake/build
          key: ${{ inputs.seed-cache || format('erdos535-openai-{0}-{1}-{2}-{3}-{4}-{5}', runner.os, runner.arch, env.OPENAI_MATH_COMMIT, github.run_id, github.run_attempt, inputs.stage) }}
          restore-keys: |
            erdos535-openai-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENAI_MATH_COMMIT }}-complete-
            erdos535-openai-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENAI_MATH_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}-
            erdos535-openai-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENAI_MATH_COMMIT }}-
      - name: Download compiled modules from the parallel jobs
        id: frontier
        if: inputs.restore-frontier
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: frontier-*
          path: ${{ runner.temp }}/frontier
      - name: Merge the parallel build outputs
        if: inputs.restore-frontier && steps.frontier.outcome == 'success'
        run: |
          shopt -s nullglob
          for archive in "$RUNNER_TEMP"/frontier/*/modules.tar.zst "$RUNNER_TEMP"/frontier/modules.tar.zst; do
            [[ -f "$archive" ]] || continue
            tar --zstd --no-same-owner --no-same-permissions -xf "$archive" -C "$RUNNER_TEMP/openai-math/lean"
          done
      - name: Build the upstream sunflower theorem
        id: upstream
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
          STAGE: ${{ inputs.stage }}
          CACHE_PREFIX: erdos535-openai-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENAI_MATH_COMMIT }}
          RESTORED_KEY: ${{ steps.seed.outputs.cache-matched-key }}
        run: |
          cd "$RUNNER_TEMP/openai-math/lean"
          status=0
          bash "$GITHUB_WORKSPACE/verification/build_upstream.sh" 255m +OAI.Combinatorics.Sunflower.FixedBase:olean \
            2>&1 | tee "$GITHUB_WORKSPACE/verification/results/upstream-build.log" || status=$?
          if [[ "$status" != 0 ]] && grep -q 'Finished with result: oom-kill' "$GITHUB_WORKSPACE/verification/results/upstream-build.log"; then
            status=137
          fi
          cache_suffix="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$STAGE"
          if [[ "$status" == 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            if [[ "$RESTORED_KEY" == "$CACHE_PREFIX-complete-"* ]]; then
              echo "cache-key=$RESTORED_KEY" >> "$GITHUB_OUTPUT"
            else
              echo "cache-key=$CACHE_PREFIX-complete-$cache_suffix" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "cache-key=$CACHE_PREFIX-$cache_suffix" >> "$GITHUB_OUTPUT"
            if [[ "$status" == 124 || "$status" == 137 ]]; then
              echo "Build interrupted with status $status. Saving the compiled modules."
              if [[ "$CHECKPOINT" != true ]]; then
                exit "$status"
              fi
            elif [[ "$status" != 0 ]]; then
              echo 'fatal=true' >> "$GITHUB_OUTPUT"
              exit "$status"
            fi
          fi
      - name: Save completed upstream modules
        if: ${{ !cancelled() && steps.upstream.outputs.cache-key != '' && steps.upstream.outputs.cache-key != steps.seed.outputs.cache-matched-key }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/openai-math/lean/.lake/build
            ${{ runner.temp }}/openai-math/lean/.lake/packages/lemmata/lean/.lake/build
            ${{ runner.temp }}/openai-math/lean/.lake/packages/fixed-point-theorems/.lake/build
          key: ${{ steps.upstream.outputs.cache-key }}
      - name: Build the pinned Lean Comparator and exporter
        if: steps.upstream.outputs.ready == 'true'
        run: |
          git init "$RUNNER_TEMP/comparator"
          git -C "$RUNNER_TEMP/comparator" fetch --depth=1 https://github.com/leanprover/comparator.git "$COMPARATOR_COMMIT"
          git -C "$RUNNER_TEMP/comparator" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/comparator"
          lake "+$LEAN_TOOLCHAIN" build Comparator lean4export
      - name: Compare the exact FC declarations and replay the compiled proof
        id: compare
        if: steps.upstream.outputs.ready == 'true'
        run: |
          cd "$RUNNER_TEMP/openai-math/lean"
          lake env bash "$GITHUB_WORKSPACE/verification/verify.sh" --comparator "$RUNNER_TEMP/comparator" \
            2>&1 | tee "$GITHUB_WORKSPACE/verification/results/full-audit.log"
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: comparator-audit-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}
          path: verification/results/
          retention-days: 90
          if-no-files-found: ignore
